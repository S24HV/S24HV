<svg width="700" height="460" viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, 'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bg { fill: #0d1117; }
    .chrome { fill: #161b22; }
    .dot-r { fill: #ff5f56; }
    .dot-y { fill: #ffbd2e; }
    .dot-g { fill: #27c93f; }
    .title { fill: #6e7681; font-size: 13px; }
    .cmd { fill: #39D353; font-size: 15px; }
    .out { fill: #8b949e; font-size: 15px; }
    .line {
      opacity: 0;
      animation: fadeUp 0.55s ease-out forwards;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .cursor {
      fill: #39D353;
      opacity: 0;
      animation: blink 1s steps(1) infinite;
      animation-delay: 2.6s;
    }
    @keyframes blink {
      0%, 49%  { opacity: 0; }
      50%, 100%{ opacity: 1; }
    }
    .l0  { animation-delay: 0.00s; }
    .l1  { animation-delay: 0.15s; }
    .l2  { animation-delay: 0.35s; }
    .l3  { animation-delay: 0.50s; }
    .l4  { animation-delay: 0.70s; }
    .l5  { animation-delay: 0.85s; }
    .l6  { animation-delay: 1.05s; }
    .l7  { animation-delay: 1.20s; }
    .l8  { animation-delay: 1.40s; }
    .l9  { animation-delay: 1.55s; }
    .l10 { animation-delay: 1.75s; }
    .l11 { animation-delay: 1.90s; }
    .l12 { animation-delay: 2.05s; }
  </style>

  <rect class="bg" width="700" height="460" rx="10"/>
  <rect class="chrome" width="700" height="34" rx="10"/>
  <rect class="chrome" x="0" y="20" width="700" height="14"/>
  <circle class="dot-r" cx="22" cy="17" r="6"/>
  <circle class="dot-y" cx="42" cy="17" r="6"/>
  <circle class="dot-g" cx="62" cy="17" r="6"/>
  <text class="title" x="350" y="21" text-anchor="middle">s24hv@security:~</text>

  <g transform="translate(24,0)">
    <text class="line l0 cmd"  x="0" y="66"  >$ whoami</text>
    <text class="line l1 out"  x="0" y="90"  >S24HV — frontend dev turned security researcher</text>

    <text class="line l2 cmd"  x="0" y="126" >$ cat mission.txt</text>
    <text class="line l3 out"  x="0" y="150" >Understand how it's built — then understand how it breaks.</text>

    <text class="line l4 cmd"  x="0" y="186" >$ cat focus.txt</text>
    <text class="line l5 out"  x="0" y="210" >Penetration testing | Web application security</text>

    <text class="line l6 cmd"  x="0" y="246" >$ cat learning.txt</text>
    <text class="line l7 out"  x="0" y="270" >Python, Bash — scripting and automation</text>

    <text class="line l8 cmd"  x="0" y="306" >$ cat background.txt</text>
    <text class="line l9 out"  x="0" y="330" >JavaScript, TypeScript, HTML/CSS</text>

    <text class="line l10 cmd" x="0" y="366" >$ whois s24hv</text>
    <text class="line l11 out" x="0" y="390" >Based in Tashkent, Uzbekistan</text>
    <text class="line l12 out" x="0" y="414" >Contact: amirsuhov@gmail.com</text>

    <rect class="cursor" x="200" y="402" width="9" height="16"/>
  </g>
</svg>
