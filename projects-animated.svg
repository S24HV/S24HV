<text class="idx" x="658" y="460" text-anchor="end">05</text>
<rect class="glowbar" x="14" y="434" width="4" height="56" rx="2" fill="#F7DF1E" filter="url(#glow)"/>
<circle class="dot" cx="42" cy="444" r="3" fill="#F7DF1E"/>
<text class="name" x="56" y="450">Weather</text>
