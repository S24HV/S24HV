<rect class="glowbar" x="14" y="230" width="4" height="56" rx="2" fill="#58a6ff" filter="url(#glow)"/>
<circle class="dot" cx="42" cy="240" r="3" fill="#58a6ff"/>
<text class="name" x="56" y="246">NoteFace_Game</text>
