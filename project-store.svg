<svg width="690" height="108" viewBox="0 0 690 108" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="6" result="blur"/>
<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#11161d"/>
<stop offset="100%" stop-color="#0a0e14"/>
</linearGradient>
</defs>
<style>
.card { stroke: #30363d; stroke-width: 1; }
.name { font-size: 17px; font-weight: 700; fill: #e6edf3; }
.desc { font-size: 13px; fill: #8b949e; }
.stack { font-size: 11.5px; fill: #6e7681; letter-spacing: 0.3px; }
.idx { font-family: "Consolas","Courier New",monospace; font-size: 34px; font-weight: 700; opacity: 0.07; fill: #e6edf3; }
.wrap { opacity: 0; transform: translateX(-14px); animation: slideIn 0.55s ease-out forwards; }
@keyframes slideIn { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: translateX(0); } }
.wrap { animation-delay: 0.10s; }
.glowbar { animation: glowPulse 2.4s ease-in-out infinite; }
@keyframes glowPulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
.dot { animation: dotPulse 2.4s ease-in-out infinite; }
@keyframes dotPulse { 0%,100% { r: 3; opacity: 0.6; } 50% { r: 4; opacity: 1; } }
</style>
<g class="wrap">
<rect class="card" x="14" y="12" width="660" height="84" rx="14" fill="url(#cardGrad)"/>
<text class="idx" x="658" y="52" text-anchor="end">01</text>
<rect class="glowbar" x="14" y="26" width="4" height="56" rx="2" fill="#58a6ff" filter="url(#glow)"/>
<circle class="dot" cx="42" cy="36" r="3" fill="#58a6ff"/>
<text class="name" x="56" y="42">Store</text>
<text class="desc" x="38" y="64">Full shopping flow — browse, cart, checkout, state</text>
<text class="stack" x="38" y="84">REACT, TYPESCRIPT, VITE</text>
</g>
</svg>